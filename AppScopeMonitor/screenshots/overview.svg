    <path d="M55 301H1145M55 368H1145M55 435H1145M55 502H1145M55 569H1145" stroke="#2d3548"/>
    <text x="56" y="342" fill="#e2e6f0" font-size="16">sample-browser</text><text x="340" y="342" fill="#9dc8f2" font-size="16">example.test:443</text><text x="750" y="342" fill="#75d7a2" font-size="15">Established</text><text x="984" y="342" fill="#b0bacd" font-size="15">Network</text>
    <text x="56" y="409" fill="#e2e6f0" font-size="16">sample-sync</text><text x="340" y="409" fill="#9dc8f2" font-size="16">198.51.100.24:443</text><text x="750" y="409" fill="#75d7a2" font-size="15">Established</text><text x="984" y="409" fill="#b0bacd" font-size="15">Network</text>
    <text x="56" y="476" fill="#e2e6f0" font-size="16">sample-editor</text><text x="340" y="476" fill="#9dc8f2" font-size="16">203.0.113.8:443</text><text x="750" y="476" fill="#75d7a2" font-size="15">Established</text><text x="984" y="476" fill="#b0bacd" font-size="15">Network</text>
    <text x="56" y="543" fill="#e2e6f0" font-size="16">sample-service</text><text x="340" y="543" fill="#9dc8f2" font-size="16">example.test:443</text><text x="750" y="543" fill="#75d7a2" font-size="15">Established</text><text x="984" y="543" fill="#b0bacd" font-size="15">Network</text>
    <text x="58" y="625" fill="#7f8ba2" font-size="13">Fictional rows and documentation-only addresses</text>
    <text x="35" y="700" fill="#8290aa" font-size="13">SYNTHETIC EXAMPLE UI · No real process, file, or network data</text>
