<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AppScope Monitor example dashboard</title>
  <desc id="desc">A fictional monitoring dashboard with synthetic connection and collector information.</desc>
  <rect width="1200" height="720" fill="#10131b"/><rect width="1200" height="72" fill="#171b27"/>
  <text x="36" y="47" fill="#f4f6ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">AppScope Monitor</text>
  <text x="1000" y="44" fill="#8ea0b7" font-family="Arial,sans-serif" font-size="14">SAMPLE DEVICE</text>
  <g font-family="Arial,sans-serif">
    <rect x="32" y="94" width="1136" height="94" rx="14" fill="#1b2230"/>
    <text x="54" y="128" fill="#aab6cb" font-size="14">COLLECTORS</text>
    <text x="54" y="163" fill="#75d7a2" font-size="22" font-weight="700">5 active</text>
    <text x="280" y="163" fill="#e8c97b" font-size="22" font-weight="700">2 limited</text>
    <text x="519" y="163" fill="#93a1b9" font-size="22" font-weight="700">3 unavailable</text>
    <text x="852" y="163" fill="#93a1b9" font-size="14">No firewall rules applied</text>
    <rect x="32" y="208" width="1136" height="462" rx="14" fill="#171b27"/>
