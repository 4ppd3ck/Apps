    <rect x="70" y="257" width="1060" height="78" rx="12" fill="#202638"/>
    <text x="94" y="292" fill="#f0f2f8" font-size="16" font-weight="700">Sample dashboard</text><text x="94" y="317" fill="#8eb8e7" font-size="14">192.0.2.10:8765</text><rect x="970" y="279" width="116" height="30" rx="15" fill="#1d3a2c"/><text x="997" y="299" fill="#80d4a0" font-size="13">running</text>
