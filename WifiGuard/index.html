<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wi-Fi Guard</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; font: 15px/1.55 -apple-system, "Segoe UI", sans-serif; background: #12141c; color: #e8eaf2; }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #8a90a5; font-size: 13px; margin-bottom: 16px; }
  .stat { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .pill { background: #181b26; border: 1px solid #262b3d; border-radius: 12px; padding: 12px 18px; }
  .pill b { font-size: 22px; display: block; }
  .pill span { color: #8a90a5; font-size: 12.5px; }
  .row { display: flex; gap: 10px; align-items: center; background: #181b26; border: 1px solid #262b3d; border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; flex-wrap: wrap; }
  .name { font-weight: 650; }
  .url { color: #7fb0e8; font-size: 13px; word-break: break-all; cursor: pointer; }
  .badge { margin-left: auto; border-radius: 20px; padding: 2px 10px; font-size: 12px; background: #222739; }
  .badge.on { background: #1d3325; color: #7fd6a0; }
  .badge.off { background: #33221d; color: #d6a07f; }
  .note { color: #6d7389; font-size: 12px; margin-top: 16px; }
  .err { color: #ff9c9c; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🛰️ Wi-Fi Guard</h1>
  <div class="sub">What this deck shares with your network, at a glance. Reading <code>/api/apps</code> from the launcher via <code>window.APPDECK</code>.</div>
  <div class="stat" id="stat"></div>
  <div id="list"></div>
  <div class="note">Click a URL to copy it. Flip sharing from the dashboard (📶/💻 on each card) — this page refreshes on load.</div>
</div>
<script>
"use strict";
(async () => {
  const $ = (s) => document.querySelector(s);
  const esc = (t) => String(t ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;");
  // short display (:port) — the path is an implementation detail; clicking
  // still copies the full working URL. Declared as a function so it hoists.
  function shortUrl(u) { try { return ":" + new URL(u).port; } catch { return u; } }
  const launcher = (window.APPDECK && window.APPDECK.launcher) || location.origin;
  const list = $("#list"), stat = $("#stat");
  try {
    const res = await fetch(launcher + "/api/apps", { cache: "no-store" });
    const data = await res.json();
    const apps = Array.isArray(data) ? data : (data.apps || []);
    const shared = apps.filter(a => a.network && !a.desktop && a.url);
    const hidden = apps.filter(a => !a.network);
    const running = apps.filter(a => a.running);
    stat.innerHTML =
      `<div class="pill"><b>${shared.length}</b><span>shared on Wi-Fi</span></div>` +
      `<div class="pill"><b>${hidden.length}</b><span>local only</span></div>` +
      `<div class="pill"><b>${running.length}</b><span>running now</span></div>`;
    const rows = shared.map(a => `
      <div class="row">
        <span>${a.icon || "📦"}</span>
        <span class="name">${esc(a.name)}</span>
        ${a.running ? `<span class="badge on">running</span>` : `<span class="badge off">stopped</span>`}
        ${a.lanUrl ? `<span class="url" data-u="${esc(a.lanUrl)}" title="${esc(a.lanUrl)} — click to copy">${esc(shortUrl(a.lanUrl))}</span>` : `<span class="url">no LAN IP detected</span>`}
      </div>`).join("");
    list.innerHTML = (rows || "<div class='row'>Nothing is shared — flip apps with the 📶/💻 button in the dashboard.</div>") +
      `<div class="note">Local-only apps (${hidden.length}) are hidden from this list by design.</div>`;
    document.querySelectorAll("[data-u]").forEach(el =>
      el.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(el.dataset.u);
          const old = el.textContent;
          el.textContent = "copied ✓";
          setTimeout(() => (el.textContent = old), 1000);
        } catch { /* clipboard unavailable outside secure contexts */ }
      }));
  } catch (e) {
    stat.innerHTML = "";
    list.innerHTML = `<div class="err">Could not load app status from ${esc(launcher)} — ${esc(String(e && e.message || e))}</div>`;
  }
})();
</script>
</body>
</html>
