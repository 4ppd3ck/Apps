<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wi-Fi Guard</title>
<script>
/* pre-paint theme (dark default; light only if chosen, "auto" follows the OS) */
try {
  var _t = localStorage.getItem("wifiguard-theme");
  if (_t === "auto") _t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  if (_t === "light") document.documentElement.classList.add("light");
} catch (e) {}
</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #12141c; --fg: #e8eaf2; --muted: #8a90a5; --card: #181b26; --border: #262b3d;
    --accent: #7fb0e8; --badge: #222739; --ok-bg: #1d3325; --ok: #7fd6a0; --warn-bg: #33221d; --warn: #d6a07f;
    --note: #6d7389; --err: #ff9c9c; --shadow: rgba(0, 0, 0, .4);
  }
  :root.light {
    color-scheme: light;
    --bg: #f4f5f9; --fg: #1d2030; --muted: #5b617a; --card: #ffffff; --border: #dde0ec;
    --accent: #2e6fb0; --badge: #eceef7; --ok-bg: #ddf1e4; --ok: #1c7a44; --warn-bg: #f7e6dc; --warn: #a2562a;
    --note: #6d7389; --err: #c53d3d; --shadow: rgba(30, 34, 60, .18);
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; font: 15px/1.55 -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); transition: background .2s, color .2s; }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .bar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .btn { background: var(--card); border: 1px solid var(--border); color: var(--fg); border-radius: 10px; padding: 5px 12px; font: 13px/1.3 -apple-system, "Segoe UI", sans-serif; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn:active { transform: translateY(1px); }
  #theme { margin-left: auto; }
  .live { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .live .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); animation: pulse 2s ease-in-out infinite; }
  .live.err { color: var(--err); }
  .live.err .dot { background: var(--err); animation: none; }
  @keyframes pulse { 50% { opacity: .3; } }
  .stat { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .pill { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 18px; }
  .pill b { font-size: 22px; display: block; }
  .pill span { color: var(--muted); font-size: 12.5px; }
  .row { display: flex; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; flex-wrap: wrap; }
  .name { font-weight: 650; }
  .url { color: var(--accent); font-size: 13px; word-break: break-all; cursor: pointer; }
  .badge { margin-left: auto; border-radius: 20px; padding: 2px 10px; font-size: 12px; background: var(--badge); }
  .badge.on { background: var(--ok-bg); color: var(--ok); }
  .badge.off { background: var(--warn-bg); color: var(--warn); }
  .note { color: var(--note); font-size: 12px; margin-top: 16px; }
  .err { color: var(--err); }
  #toasts { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 10; width: max-content; max-width: min(92vw, 520px); }
  .toast { background: var(--card); color: var(--fg); border: 1px solid var(--border); border-left: 3px solid var(--ok); border-radius: 10px; padding: 8px 14px; font-size: 13px; box-shadow: 0 8px 24px var(--shadow); animation: tIn .25s ease; }
  .toast.off { border-left-color: var(--warn); }
  .toast.out { opacity: 0; transform: translateY(-8px); transition: opacity .3s, transform .3s; }
  @keyframes tIn { from { opacity: 0; transform: translateY(-8px); } }
  @media (prefers-reduced-motion: reduce) { .live .dot, .toast { animation: none; } .toast.out { transition: none; } }
</style>
</head>
<body>
<div id="toasts" aria-live="polite"></div>
<div class="wrap">
  <h1>🛰️ Wi-Fi Guard</h1>
  <div class="sub">What this deck shares with your network, at a glance. Reading <code>/api/apps</code> from the launcher via <code>window.APPDECK</code>.</div>
  <div class="bar">
    <span id="live" class="live" title="Auto-refreshes every 5 s"><span class="dot"></span>live</span>
    <button id="refresh" class="btn" title="Fetch now">↻ Refresh</button>
    <button id="theme" class="btn" title="Dark theme — click for light">🌙 dark</button>
  </div>
  <div class="stat" id="stat"></div>
  <div id="list"></div>
  <div class="note">Click a URL to copy it. Flip sharing from the dashboard (📶/💻 on each card) — this page tracks changes live.</div>
</div>
<script>
"use strict";
(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (t) => String(t ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
  // short display (:port) — the path is an implementation detail; clicking
  // still copies the full working URL. Declared as a function so it hoists.
  function shortUrl(u) { try { return ":" + new URL(u).port; } catch { return u; } }
  const launcher = (window.APPDECK && window.APPDECK.launcher) || location.origin;
  const list = $("#list"), stat = $("#stat"), liveEl = $("#live"), toasts = $("#toasts"), themeBtn = $("#theme");
  const POLL_MS = 5000, TOAST_MS = 6000;

  let inFlight = false, ctrl = null, tickId = 0;
  let prevShared = null;                 // Map key -> name; null until first load (no toasts then)
  let lastStat = null, lastList = null;  // last rendered HTML — skip DOM writes when unchanged
  let lastCount = -1;

  function toast(html, off) {
    const el = document.createElement("div");
    el.className = "toast" + (off ? " off" : "");
    el.innerHTML = html;
    toasts.appendChild(el);
    while (toasts.children.length > 4) toasts.firstChild.remove();
    setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 350); }, TOAST_MS);
  }

  function notify(prev, next) {
    if (!prev) return;
    for (const [key, name] of next) if (!prev.has(key)) toast(`${esc(name)} is now shared on Wi-Fi`);
    for (const [key, name] of prev) if (!next.has(key)) toast(`${esc(name)} no longer shared`, true);
  }

  function render(apps) {
    const shared = apps.filter(a => a.network && !a.desktop && a.url);
    const hidden = apps.filter(a => !a.network);
    const running = apps.filter(a => a.running);
    const statHtml =
      `<div class="pill"><b>${shared.length}</b><span>shared on Wi-Fi</span></div>` +
      `<div class="pill"><b>${hidden.length}</b><span>local only</span></div>` +
      `<div class="pill"><b>${running.length}</b><span>running now</span></div>`;
    const rows = shared.map(a => `
      <div class="row">
        <span>${a.icon || "📦"}</span>
        <span class="name">${esc(a.name)}</span>
        ${a.running ? `<span class="badge on">running</span>` : `<span class="badge off">stopped</span>`}
        ${a.lanUrl ? `<span class="url" data-u="${esc(a.lanUrl)}" title="${esc(a.lanUrl)} — click to copy">${esc(shortUrl(a.lanUrl))}</span>` : `<span class="url">no LAN IP detected</span>`}
      </div>`).join("");
    const listHtml = (rows || "<div class='row'>Nothing is shared — flip apps with the 📶/💻 button in the dashboard.</div>") +
      `<div class="note">Local-only apps (${hidden.length}) are hidden from this list by design.</div>`;
    const y = window.scrollY; // keep the viewport steady across re-renders
    if (statHtml !== lastStat) { stat.innerHTML = statHtml; lastStat = statHtml; }
    if (listHtml !== lastList) { list.innerHTML = listHtml; lastList = listHtml; }
    window.scrollTo(0, y);
    const now = new Map(shared.map(a => [a.id || a.name || "", a.name]));
    notify(prevShared, now);
    prevShared = now;
    if (shared.length !== lastCount) {
      lastCount = shared.length;
      document.title = shared.length ? `(${shared.length}) Wi-Fi Guard` : "Wi-Fi Guard";
    }
  }

  async function tick(manual) {
    if (inFlight) {
      if (!manual) return;   // never overlap polls
      ctrl && ctrl.abort();  // a manual refresh supersedes the in-flight poll
    }
    const me = ++tickId;
    inFlight = true;
    ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 4500);
    try {
      const res = await fetch(launcher + "/api/apps", { cache: "no-store", signal: ctrl.signal });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      liveEl.classList.remove("err");
      liveEl.title = "Auto-refreshes every 5 s";
      render(Array.isArray(data) ? data : (data.apps || []));
    } catch (e) {
      // only the newest fetch touches the error UI (an abort superseded by a newer poll stays silent)
      if (me === tickId) {
        liveEl.classList.add("err");
        liveEl.title = "Last refresh failed — retrying every 5 s";
        if (lastStat === null) { // nothing ever loaded: surface the error inline
          stat.innerHTML = "";
          list.innerHTML = `<div class="err">Could not load app status from ${esc(launcher)} — ${esc(String(e && e.message || e))}</div>`;
        }
      }
    } finally {
      clearTimeout(timer);
      if (me === tickId) { inFlight = false; ctrl = null; }
    }
  }

  $("#refresh").addEventListener("click", () => tick(true));

  // theme: one toggle, three states — 🌙 dark → ☀️ light → 🌗 auto (device).
  // Dark is the default on first visit; every choice is stored so it sticks.
  const themeMq = window.matchMedia ? matchMedia("(prefers-color-scheme: light)") : null;
  let themeMode = "dark";
  try {
    const saved = localStorage.getItem("wifiguard-theme");
    if (saved === "dark" || saved === "light" || saved === "auto") themeMode = saved;
  } catch (e) {}
  function setThemeLabel() {
    const light = themeMode === "light" || (themeMode === "auto" && themeMq && themeMq.matches);
    document.documentElement.classList.toggle("light", light);
    themeBtn.textContent = themeMode === "dark" ? "🌙 dark" : themeMode === "light" ? "☀️ light" : "🌗 auto";
    themeBtn.title = themeMode === "dark" ? "Dark theme — click for light"
      : themeMode === "light" ? "Light theme — click to follow this device's appearance"
      : "Follows this device's appearance — click for dark";
  }
  themeBtn.addEventListener("click", () => {
    themeMode = themeMode === "dark" ? "light" : themeMode === "light" ? "auto" : "dark";
    try { localStorage.setItem("wifiguard-theme", themeMode); } catch (e) {}
    setThemeLabel();
  });
  if (themeMq && themeMq.addEventListener) {
    themeMq.addEventListener("change", () => { if (themeMode === "auto") setThemeLabel(); });
  }
  setThemeLabel();

  // one delegated listener survives every re-render (no handler stacking)
  list.addEventListener("click", async (e) => {
    const el = e.target.closest("[data-u]");
    if (!el) return;
    try {
      await navigator.clipboard.writeText(el.dataset.u);
      const old = el.textContent;
      el.textContent = "copied ✓";
      setTimeout(() => { if (el.textContent === "copied ✓") el.textContent = old; }, 1000);
    } catch { /* clipboard unavailable outside secure contexts */ }
  });

  tick(false);
  setInterval(() => tick(false), POLL_MS);
})();
</script>
</body>
</html>
