<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">RepoLens example search</title><desc id="desc">A fictional GitHub app search page with sample repository results.</desc>
  <rect width="1200" height="720" fill="#10131b"/><rect width="1200" height="72" fill="#171b27"/>
  <text x="38" y="47" fill="#f4f6ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">RepoLens</text><text x="1000" y="44" fill="#8ea0b7" font-family="Arial,sans-serif" font-size="14">LOCAL SEARCH</text>
  <g font-family="Arial,sans-serif">
    <text x="70" y="133" fill="#f4f6ff" font-size="29" font-weight="700">Find an app that fits</text>
    <rect x="70" y="158" width="1060" height="58" rx="14" fill="#202638" stroke="#48516a"/>
    <text x="96" y="194" fill="#dce2f2" font-size="17">music player for local files</text><rect x="984" y="168" width="128" height="38" rx="9" fill="#5865e8"/><text x="1012" y="193" fill="#fff" font-size="15" font-weight="700">Search</text>
    <text x="70" y="255" fill="#95a2b9" font-size="14">EXAMPLE RESULTS · Public GitHub data may change</text>
    <rect x="70" y="278" width="1060" height="118" rx="14" fill="#1a2030" stroke="#303951"/>
    <text x="96" y="316" fill="#a9c9f3" font-size="20" font-weight="700">sample-audio-player</text><text x="96" y="345" fill="#aab4c7" font-size="15">A fictional desktop player for locally stored audio.</text><text x="96" y="374" fill="#8795ad" font-size="13">★ 1.2k   ·   Updated recently   ·   Linux / macOS</text>
    <rect x="70" y="414" width="1060" height="118" rx="14" fill="#1a2030" stroke="#303951"/>
    <text x="96" y="452" fill="#a9c9f3" font-size="20" font-weight="700">sample-library</text><text x="96" y="481" fill="#aab4c7" font-size="15">A fictional library manager with an optional web interface.</text><text x="96" y="510" fill="#8795ad" font-size="13">★ 840   ·   Updated this month   ·   Windows / Linux</text>
    <rect x="70" y="550" width="1060" height="88" rx="14" fill="#1a2030" stroke="#303951"/>
    <text x="96" y="588" fill="#a9c9f3" font-size="20" font-weight="700">sample-stream-tools</text><text x="96" y="615" fill="#aab4c7" font-size="15">A fictional open-source utility; inspect the source before running.</text>
    <text x="35" y="686" fill="#8290aa" font-size="13">SYNTHETIC EXAMPLE UI · No real token, user, or search history</text>
  </g>
</svg>
